name: Smoke Probe
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: startprobe
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -m 20 -X POST -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/${{ github.event.issue.number }}/comments" -d "{\"body\":\"SMOKE run=$GITHUB_RUN_ID runner=$RUNNER_NAME\"}" || true
